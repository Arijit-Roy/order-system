
services:
  redis:
    image: redis:7
    restart: unless-stopped
    # container_name: order-redis
    ports:
      - "6379:6379"
    volumes:
      - "redis_data:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:16
    restart: unless-stopped
    # container_name: order-postgres
    environment:
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpass
      POSTGRES_DB: ordersdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderuser -d ordersdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
  order-server:
    image: order-server:latest
    restart: unless-stopped
    build:
      context: .
      args:
        SERVICE: server
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: orderuser
      DB_PASSWORD: orderpass
      DB_NAME: ordersdb
      REDIS_ADDR: redis:6379
    ports: 
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  publisher:
    image: order-system-publisher:latest
    restart: unless-stopped
    build:
      context: .
      args:
        SERVICE: publisher
    environment:
      ORDER_SERVER_ADDR: order-server:50051
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: orderuser
      DB_PASSWORD: orderpass
      DB_NAME: ordersdb
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  inventory:
    image: order-system-inventory:latest
    restart: unless-stopped
    build:
      context: .
      args:
        SERVICE: inventory
    environment:
      ORDER_SERVER_ADDR: order-server:50051
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: orderuser
      DB_PASSWORD: orderpass
      DB_NAME: inventorydb
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  # client:
  #   image: order-system-client:latest 
  #   build:
  #     context: .
  #     args:
  #       SERVICE: client
  notification:
    image: order-system-notification:latest
    restart: unless-stopped
    build:
      context: .
      args:
        SERVICE: notification
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:


