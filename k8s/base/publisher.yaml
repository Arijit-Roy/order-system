apiVersion: apps/v1
kind: Deployment
metadata:
  name: publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: publisher
  template:
    metadata:
      labels:
        app: publisher
    spec:
      containers:
        - name: publisher
          image: order-system-publisher:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: order-config
            - secretRef:
                name: order-secret