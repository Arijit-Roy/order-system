apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-server
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  replicas: 3
  selector:
    matchLabels:
      app: order-server
  template:
    metadata:
      labels:
        app: order-server
    spec:
      containers: 
        - name: order-server
          image: order-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          envFrom:
              - configMapRef:
                  name: order-config
              - secretRef:
                  name: order-secret
---
apiVersion: v1
kind: Service
metadata:
  name: order-server
spec:
  selector:
    app: order-server
  # ports:
  #   - protocol: TCP
  #     port: 50051
  #     targetPort: 50051


  ports:
  - name: grpc
    port: 50051
    targetPort: 50051

  - name: metrics
    port: 8080
    targetPort: 8080

