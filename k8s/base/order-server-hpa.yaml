apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: order-server
  namespace: order-system

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-server

  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60