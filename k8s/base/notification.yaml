apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: order-system-notification:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: order-config
            - secretRef:
                name: order-secret